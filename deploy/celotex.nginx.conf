# Preserve the AzuraCast ACME HTTP-01 challenge and redirect other requests to HTTPS.
server {
    listen 80;
    server_name celotex.cucandoti.com.br;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/azuracast/storage/acme/challenges/;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name celotex.cucandoti.com.br;

    ssl_certificate /var/azuracast/storage/acme/ssl.crt;
    ssl_certificate_key /var/azuracast/storage/acme/ssl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://172.18.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 16k;
    }
}
